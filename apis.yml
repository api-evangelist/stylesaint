description: >-
  StyleSaint is a Los Angeles-based direct-to-consumer luxury women's fashion
  brand, originally an a16z-backed social-commerce startup and now an
  independent e-commerce label selling silk, lace, and other luxury-fabric
  apparel that is handmade in LA, ethically made, and sustainably sourced. The
  storefront runs on Shopify. As of this enrichment pass StyleSaint publishes no
  public developer program, API documentation, OpenAPI/AsyncAPI specification,
  SDKs, or agent-facing surface of its own; it is catalogued here as an a16z
  portfolio company. Any programmable commerce capability would be provided by
  the underlying Shopify platform rather than by a first-party StyleSaint API.
